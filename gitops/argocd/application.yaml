# Lab 23 - the Argo CD Application named `ivolve`.
# It watches the `gitops/manifests/base` directory of the GitHub repo and
# keeps the cluster in sync with it automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ivolve-gitops
  finalizers:
    # Deleting the Application also deletes the resources it created.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ivolve

  source:
    repoURL: https://github.com/whabeba/IvolVe-Tasks.git
    targetRevision: main
    path: gitops/manifests/base

  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
