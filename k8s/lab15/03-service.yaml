apiVersion: v1
kind: Service
metadata:
  name: ivolveappsvc
  namespace: ivolve
  labels:
    app: ivolveapp
spec:
  # ClusterIP: reachable inside the cluster, load-balanced across both Pods
  type: ClusterIP
  selector:
    app: ivolveapp
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
