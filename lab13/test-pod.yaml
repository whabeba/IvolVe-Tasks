apiVersion: v1
kind: Pod
metadata:
  name: logging-test
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Lab 13 logging test' > /logs/app.log; sleep 3600"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      persistentVolumeClaim:
        claimName: ivolvepvc