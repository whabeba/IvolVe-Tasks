services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - app-logs:/app/logs
    networks:
      - ivolve-net
    depends_on:
      - db

  db:
    image: mysql:8
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net

networks:
  ivolve-net:
    driver: bridge

volumes:
  app-logs:
  db_data: